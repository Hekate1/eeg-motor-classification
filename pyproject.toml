[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eeg-motor-classification"
version = "0.1.0"
description = "Motor imagery EEG: headset app, training pipeline, and results notebook."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}

[project.scripts]
eeg-headset-frontend = "headset_frontend.run:main"
eeg-public-train = "pipeline.public.train:main"
eeg-self-train = "pipeline.self.train:main"
eeg-self-classical = "pipeline.self.classical:main"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
where = ["apps/headset_frontend/src", "pipeline/src"]

